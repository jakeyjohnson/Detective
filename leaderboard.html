<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — Detective</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080A0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080A0E'/%3E%3Ccircle cx='14' cy='13' r='7' fill='none' stroke='%23E0A93B' stroke-width='3'/%3E%3Cpath d='M19 18 L26 26' stroke='%23E0A93B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand__mark" aria-hidden="true"></span>
    <span>Detective</span>
  </a>
  <span class="spacer"></span>
  <span class="label mono" id="board-code"></span>
</header>

<main class="page page--narrow">
  <div class="page__head" id="board-head"></div>

  <div class="row row--wrap" id="board-meta" style="margin-bottom: var(--sp-5)"></div>

  <form class="row is-hidden" id="code-form" style="margin-bottom: var(--sp-5)">
    <input class="input input--mono" id="code-input" type="text" placeholder="Game code"
           maxlength="5" autocapitalize="characters" autocomplete="off" aria-label="Game code">
    <button class="btn btn--primary" type="submit">Show</button>
  </form>

  <div class="board" id="board"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/quiz-model.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/leaderboard.js"></script>
</body>
</html>
