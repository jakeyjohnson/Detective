<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A word in Morse code">
<rect width="1000" height="330" fill="#EFE6CE"/>
<text x="500" y="70" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#B5892A" text-anchor="middle">TAPPED ON THE PIPE BY THE PRISONER</text><text x="500" y="190" font-family="Courier New, monospace" font-size="52" font-weight="bold" fill="#15120A" text-anchor="middle">.--. / --- / .. / ... / --- / -.</text><text x="500" y="270" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#15120A" text-anchor="middle">Six letters, separated by slashes.</text>
</svg>
